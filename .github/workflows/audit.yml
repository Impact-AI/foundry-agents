# What is known against the versions the lockfiles pin. An advisory is
# published without the repository changing, so it is asked on every change
# and once a week besides: a quiet repository hears of one too. A high or
# critical advisory fails the run unless scripts/dependency-audit.accepted.json
# accepts it, with its reason; an entry there that is no longer reported fails
# it as well.
name: Audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Lockfile advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # The lockfiles are what is asked about: nothing is installed.
      - run: bun scripts/dependency-audit.ts

# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: agent-sample
# The oldest azd this template is tested with; an older one refuses to load it.
requiredVersions:
  azd: ">= 1.37.1"
metadata:
  template: agent-sample@0.1.0

# Service paths are relative to this file, at the repository root.
# `docker.context` is relative to each project directory and resolves to the
# repository root; each Dockerfile builds from there.
services:
  backend:
    project: ./apps/backend
    host: containerapp
    language: docker
    docker:
      path: Dockerfile
      context: ../../
      remoteBuild: true
  frontend:
    project: ./apps/frontend
    host: containerapp
    language: docker
    docker:
      path: Dockerfile
      context: ../../
      remoteBuild: true

hooks:
  # azd up resolves the template's parameters before its provision step runs
  # preprovision, so the secrets preprovision generates must exist by then.
  preup:
    posix:
      shell: sh
      run: ./hooks/preprovision.sh
    windows:
      shell: pwsh
      run: ./hooks/preprovision.ps1
  preprovision:
    posix:
      shell: sh
      run: ./hooks/preprovision.sh
    windows:
      shell: pwsh
      run: ./hooks/preprovision.ps1
  postprovision:
    posix:
      shell: sh
      run: ./hooks/postprovision.sh
    windows:
      shell: pwsh
      run: ./hooks/postprovision.ps1
  postdeploy:
    posix:
      shell: sh
      run: ./hooks/postdeploy.sh
    windows:
      shell: pwsh
      run: ./hooks/postdeploy.ps1
  predown:
    posix:
      shell: sh
      run: ./hooks/predown.sh
    windows:
      shell: pwsh
      run: ./hooks/predown.ps1

# What `azd pipeline config` carries to the deploy workflow beside the
# variables azd sets itself: every value the parameter file reads that a run
# cannot derive, the session secret generated by preprovision, so a
# deploy never rotates it, and the sign-in registration.
pipeline:
  variables:
    - HARDENED
    - PRIVATE_NETWORKING
    - USE_FRONT_DOOR
    - LOCK_DATA_RESOURCES
    - KEY_VAULT_PURGE_PROTECTION
    - ZONE_REDUNDANT
    - PUBLIC_ORIGIN
    - AZURE_SEARCH_LOCATION
    - SEARCH_REPLICAS
    - BACKEND_MIN_REPLICAS
    - FRONTEND_MIN_REPLICAS
    - OPERATOR_PRINCIPAL_ID
    - OPERATOR_PRINCIPAL_TYPE
    - AUTH_MODE
    - AUTH_REQUIRE_ROLE
    - AUTH_MICROSOFT_ENTRA_ID_ID
    - SEED_SAMPLE_LIBRARY
    - KNOWLEDGE_BASE
    - MEMORY_STORE
    - HISTORY_STORE
    - RETRIEVAL_ENGINE
    - VOICE_ENGINE
    - RECORDS_API_URL
    - RECORDS_API_SCOPE
    - DEVELOPER_ACCESS
    - DEVELOPER_ACCESS_SSH_KEY
    - DEVELOPER_VM_SIZE
    - AGENT_EGRESS
    - PRIVATE_TELEMETRY
    - AGENT_TRACING
    - POLICY_AUDIT
    - REALTIME_CAPACITY
    - REALTIME_ALTERNATE_CAPACITY
    - KNOWLEDGE_BASE_CAPACITY
  secrets:
    - AUTH_SECRET
    - AUTH_MICROSOFT_ENTRA_ID_SECRET
